version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Banco de dados primário PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: configura3d-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: configura3d
      POSTGRES_PASSWORD: configura3d
      POSTGRES_DB: configura3d
    ports:
      - "5432:5432"
    volumes:
      - configura3d_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U configura3d -d configura3d"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Réplica opcional (descomente para habilitar leitura em réplica)
  # ---------------------------------------------------------------------------
  # db-replica:
  #   image: postgres:16-alpine
  #   container_name: configura3d-db-replica
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: configura3d
  #     POSTGRES_PASSWORD: configura3d
  #     POSTGRES_DB: configura3d
  #     POSTGRES_MASTER_SERVICE: db
  #     POSTGRES_REPLICATION_MODE: slave
  #     POSTGRES_REPLICATION_USER: replicator
  #     POSTGRES_REPLICATION_PASSWORD: replicator
  #     POSTGRES_MASTER_PORT: 5432
  #   ports:
  #     - "5433:5432"
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   volumes:
  #     - configura3d_db_replica_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # Redis (cache, filas, processamento em segundo plano)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: configura3d-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - configura3d_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO (S3 compatível para armazenamento de modelos e imagens)
  # ---------------------------------------------------------------------------
  minio:
    image: bitnami/minio:2024
    container_name: configura3d-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: configura3d
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - configura3d_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # API (Node.js + Fastify)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: configura3d-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: "postgresql://configura3d:configura3d@db:5432/configura3d?schema=public"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-troque-por-um-segredo-forte-de-no-minimo-32-caracteres}
      JWT_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_TIME_WINDOW: 60000
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: configura3d
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_USE_SSL: false
      PUBLIC_ASSETS_URL: http://localhost:3333/assets
      LOG_LEVEL: info
    ports:
      - "3333:3333"
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]

  # ---------------------------------------------------------------------------
  # Web (React + Vite) - servido via nginx em produção
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: configura3d-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_API_URL: http://localhost:3333
    ports:
      - "5173:80"

volumes:
  configura3d_db_data:
  configura3d_db_replica_data:
  configura3d_redis_data:
  configura3d_minio_data:

networks:
  default:
    name: configura3d
