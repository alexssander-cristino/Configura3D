
services:
  # PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: configura3d-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: configura3d
      POSTGRES_PASSWORD: configura3d
      POSTGRES_DB: configura3d
    ports:
      - "5433:5432"
    volumes:
      - configura3d_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U configura3d -d configura3d"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis
  redis:
    image: redis:7-alpine
    container_name: configura3d-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - configura3d_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Armazenamento de objetos S3 compatível com RustFS
  minio:
    image: rustfs/rustfs:latest
    container_name: configura3d-minio
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-configura3d_dev_secret_2026}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - configura3d_minio_data:/data
    command: ["/data"]

  # API Fastify + Prisma
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: configura3d-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3334"

      DATABASE_URL: postgresql://configura3d:configura3d@db:5432/configura3d?schema=public
      REDIS_URL: redis://redis:6379

      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-por-um-valor-forte-com-32-caracteres}
      JWT_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: "12"

      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      RATE_LIMIT_MAX: "100"
      RATE_LIMIT_TIME_WINDOW: "60000"

      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: configura3d
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-configura3d_dev_secret_2026}
      S3_USE_SSL: "false"
      PUBLIC_ASSETS_URL: http://localhost:3334/assets

      LOG_LEVEL: info
    ports:
      - "3334:3334"
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]

  # Frontend web
  web:
    build:
      # A raiz é necessária para acessar os workspaces locais.
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: configura3d-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:3334

volumes:
  configura3d_db_data:
  configura3d_redis_data:
  configura3d_minio_data:

networks:
  default:
    name: configura3d
